name: Ajouter un Commentaire sur un Commit avec Image

# 🎯 Déclenchement après un push sur main
on:
  push:
    branches:
      - main

# 🔐 Permissions nécessaires pour commenter le commit
permissions:
  contents: write
  issues: write

jobs:
  comment-on-commit:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Récupérer le message du dernier commit
        run: echo "MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      - name: 📥 Télécharger l'artefact contenant l'image
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts/

      - name: 🔍 Récupérer dynamiquement le nom du fichier image
        run: |
          IMAGE_NAME=$(ls ./artifacts | head -n 1)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Nom du fichier trouvé : $IMAGE_NAME"

      - name: 🔗 Construire l'URL de l'image hébergée sur GitHub
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          BRANCH="main"
          IMAGE_URL="https://raw.githubusercontent.com/${REPO_OWNER}/${REPO_NAME}/${BRANCH}/images/${IMAGE_NAME}"
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV
          echo "URL construite : $IMAGE_URL"

      - name: 💬 Ajouter un commentaire sur le commit
        uses: actions/github-script@v6
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
              body: "🚀 **Nouveau Commit Détecté !**\n\n📝 **Message du Commit :**\n" + process.env.MESSAGE + "\n\n📷 **Image générée :**\n![Image générée](" + process.env.IMAGE_URL + ")\n\n📢 _Ce message est généré automatiquement._"
            });