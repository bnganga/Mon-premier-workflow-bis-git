name: Génération d'Image et Déploiement GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  generate-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # 🔑 nécessaire pour pouvoir pousser le commit

    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Récupérer le message du dernier commit
        run: echo "MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      - name: 📂 Créer le dossier images
        run: mkdir -p images

      - name: 🎨 Générer l'image via DynaPictures
        env:
          API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          TEMPLATE_ID: ${{ secrets.DYNAPICTURES_TEMPLATE_ID }}
        run: |
          TIMESTAMP=$(date +%s)
          FILENAME="commit-$TIMESTAMP.png"

          RESPONSE=$(curl -s -X POST "https://api.dynapictures.com/designs/$TEMPLATE_ID" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"params\":[{\"name\":\"title\",\"text\":\"$MESSAGE\"}]}")

          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.imageUrl')
          curl -s -o "images/$FILENAME" "$IMAGE_URL"

          echo "Fichier généré : $FILENAME"

      # 👇 NOUVELLE ÉTAPE À AJOUTER
      - name: 💾 Committer l'image générée dans le repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add images/
          git commit -m "🤖 Ajout image générée automatiquement" || echo "Rien à committer"
          git push

      - name: 💾 Sauvegarder l'image en tant qu'artefact
        uses: actions/upload-artifact@v4
        with:
          name: image-generee
          path: images/