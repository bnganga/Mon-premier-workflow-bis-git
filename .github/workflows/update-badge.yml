name: Mise à jour du badge de commits

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'badges/**'   # 🪤 évite la boucle infinie (piège n°... implicite)
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-badge:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt (historique complet)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 🪤 PIÈGE 1 : sans ça, rev-list ne compte qu'1 commit

      - name: 🔢 Compter le nombre de commits
        id: count_commits
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: 📂 Créer le dossier badges
        run: mkdir -p badges   # 🪤 PIÈGE 3 : le dossier doit exister avant l'écriture

      - name: 📝 Écrire le fichier badge.json
        run: |
          cat > badges/badge.json << EOF
          {
            "schemaVersion": 1,
            "label": "commits",
            "message": "${{ steps.count_commits.outputs.count }}",
            "color": "blue"
          }
          EOF

      - name: 💾 Committer et pousser si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add badges/badge.json
          git diff --staged --quiet && echo "Rien à committer" || git commit -m "🤖 Mise à jour badge commits"
          git push || echo "Rien à pousser"