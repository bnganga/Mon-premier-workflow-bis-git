name: Notification Discord avec URL Dynamique

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1️⃣ Génération de l'image (comme dans l'exercice 02)
  generate-image:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Récupérer le message du dernier commit
        id: commit_message
        run: echo "MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      - name: 📂 Créer le dossier images
        run: mkdir -p images

      - name: 🎨 Générer l'image via DynaPictures
        env:
          API_KEY: ${{ secrets.DYNAPICTURES_API_KEY }}
          TEMPLATE_ID: ${{ secrets.DYNAPICTURES_TEMPLATE_ID }}
        run: |
          TIMESTAMP=$(date +%s)
          FILENAME="commit-$TIMESTAMP.png"

          RESPONSE=$(curl -s -X POST "https://api.dynapictures.com/designs/$TEMPLATE_ID" \
            -H "Authorization: Bearer $API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"params\":[{\"name\":\"title\",\"text\":\"$MESSAGE\"}]}")

          IMAGE_URL=$(echo "$RESPONSE" | jq -r '.imageUrl')
          curl -s -o "images/$FILENAME" "$IMAGE_URL"

          echo "Fichier généré : $FILENAME"

      - name: 💾 Sauvegarder l'image en tant qu'artefact
        uses: actions/upload-artifact@v4
        with:
          name: image-generee
          path: images/

  # 2️⃣ Déploiement sur GitHub Pages
  deploy-pages:
    runs-on: ubuntu-latest
    needs: generate-image
    permissions:
      contents: write
    steps:
      - name: 📥 Télécharger l'artefact image
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./images/

      - name: 🌐 Générer index.html
        run: |
          echo "<html><body><h1>Galerie de commits</h1>" > images/index.html
          for img in images/*.png; do
            echo "<img src=\"$(basename $img)\" width=\"400\">" >> images/index.html
          done
          echo "</body></html>" >> images/index.html

      - name: 🚀 Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./images

  # 3️⃣ Notification Discord avec URL dynamique
  notify-discord:
    runs-on: ubuntu-latest
    needs: [generate-image, deploy-pages]
    steps:
      - name: 📥 Cloner le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Récupérer le message du dernier commit
        run: echo "MESSAGE=$(git log -1 --pretty=%B)" >> $GITHUB_ENV

      - name: 📥 Télécharger l'artefact contenant l'image
        uses: actions/download-artifact@v4
        with:
          name: image-generee
          path: ./artifacts/

      - name: 🔍 Extraire dynamiquement le nom du fichier image
        id: extract_filename
        run: |
          IMAGE_NAME=$(ls ./artifacts | head -n 1)
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "Nom du fichier trouvé : $IMAGE_NAME"

      - name: 🔗 Construire l'URL de l'image
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="${{ github.repository_owner }}"
          IMAGE_URL="https://${REPO_OWNER}.github.io/${REPO_NAME}/${IMAGE_NAME}"
          echo "IMAGE_URL=$IMAGE_URL" >> $GITHUB_ENV
          echo "URL construite : $IMAGE_URL"

      - name: 📢 Envoyer la notification sur Discord
        run: |
          payload=$(jq -n \
            --arg message "$MESSAGE" \
            --arg image_url "$IMAGE_URL" \
            '{
              username: "Github BOT",
              avatar_url: "https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png",
              embeds: [{
                title: "🎉 Nouveau commit avec image générée",
                description: ("📝 **Message :** " + $message),
                color: 15258703,
                image: { url: $image_url },
                footer: { text: "Github Action - Automatisation" }
              }]
            }')
          curl -H "Content-Type: application/json" -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" -d "$payload"